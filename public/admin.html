<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>管理パネル｜みんなでメタ CONSOLE</title>
    <link rel="stylesheet" href="/console/colors_and_type.css">
    <link rel="stylesheet" href="/console/mt.css">
    <link rel="stylesheet" href="/console/mt-editor.css">
    <link rel="stylesheet" href="/console/mt-addons.css">
    <script type="importmap" src="/console/admin-console-importmap.json"></script>
    <script src="/console/mt-admin-early.js"></script>
    <script src="/console/vendor/three.min.js"></script>
    <script src="/console/vendor/OrbitControls.js"></script>
    <script src="/console/vendor/TransformControls.js"></script>
</head>
<body>

<section class="gate" id="gate" data-screen-label="認証">
  <div class="gate-in">
    <div class="gate-brand">
      <img src="/console/assets/icon-192.png" alt="">
      みんなでメタ
      <span class="sep"></span>
      <span>CONSOLE</span>
    </div>
    <h1>接続中…</h1>
    <p class="lead">管理 API とテナント情報を読み込んでいます。</p>
    <p class="gate-err" id="gateErr" role="alert"></p>
    <div class="gate-foot">
      <span>認証は HTTP Basic です</span>
    </div>
  </div>
</section>

<div class="app" id="app" hidden>
  <aside class="side" id="side"></aside>
  <main class="main">
    <div class="topbar" id="topbar"></div>
    <div class="page" id="main"></div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script src="/console/mt-data-live.js"></script>
<script src="/console/mt-ui.js"></script>
<script src="/console/mt-views.js"></script>
<script src="/console/mt-addons.js"></script>
<script src="/console/mt-editor.js"></script>
<script src="/console/mt-world.js"></script>
<script src="/console/mt-editor-state.js"></script>
<script src="/console/mt-app.js"></script>
<script src="/console/mt-production-editor-bridge.js"></script>
<script src="/console/mt-addons-live.js"></script>
<script src="/console/mt-platform-extensions.js"></script>
<script type="module" src="/js/admin-console-settings-mount.mjs"></script>
<script src="/console/mt-app-boot.js"></script>

</body>
</html>
