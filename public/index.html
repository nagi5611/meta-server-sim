<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Metaverse Simulation Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="hub-page">
    <div class="hub-backdrop" aria-hidden="true"></div>
    <main class="hub-panel" id="hub-panel">
        <header class="hub-header">
            <div class="hub-brand">
                <span class="hub-brand-icon" aria-hidden="true"><i class="bi bi-boxes"></i></span>
                <div>
                    <h1>メタバース シミュレーション</h1>
                    <p class="hub-subtitle">コンテナ型プラットフォーム</p>
                </div>
            </div>
        </header>

        <section class="hub-section hub-login-section" aria-labelledby="hub-login-heading">
            <div class="hub-section-head">
                <h2 id="hub-login-heading">公開ロビー</h2>
            </div>
            <p class="hub-login-lead">みんなでメタの入口は <strong>メタバースロビー</strong> です。ログイン後、公開ロビーへ移動します。</p>
            <form id="hub-login-form" class="hub-login-form" novalidate>
                <label class="hub-login-label" for="hub-login-email">メールアドレス</label>
                <input id="hub-login-email" class="hub-login-input" type="email" name="username" autocomplete="username" required />
                <label class="hub-login-label" for="hub-login-password">パスワード</label>
                <input id="hub-login-password" class="hub-login-input" type="password" name="password" autocomplete="current-password" required />
                <p id="hub-login-error" class="hub-login-error" role="alert" hidden></p>
                <button type="submit" class="hub-login-submit" id="hub-login-submit">ログインしてロビーへ</button>
            </form>
        </section>

        <section class="hub-section" aria-labelledby="hub-tenant-heading">
            <div class="hub-section-head">
                <h2 id="hub-tenant-heading">Tenant 一覧</h2>
                <p id="hub-status" class="hub-meta">読み込み中…</p>
            </div>
            <ul id="tenant-list" class="hub-tenant-list" aria-live="polite"></ul>
        </section>

        <footer class="hub-footer">
            <a class="hub-footer-link" id="hub-lobby-link" href="https://m.mmh-virtual.jp/">
                <i class="bi bi-door-open" aria-hidden="true"></i>
                公開ロビー
            </a>
            <a class="hub-footer-link" href="/admin.html">
                <i class="bi bi-shield-lock" aria-hidden="true"></i>
                管理パネル
            </a>
            <a class="hub-footer-link" href="https://m.mmh-virtual.jp/privacy.html">
                <i class="bi bi-shield-check" aria-hidden="true"></i>
                プライバシーポリシー
            </a>
        </footer>
    </main>
    <script type="module" src="/js/hub.js"></script>
</body>
</html>
