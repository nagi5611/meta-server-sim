# meta.mmh-virtual.jp — fail2ban jail overrides (installed to /etc/fail2ban/jail.d/)
# Repository copy: scripts/security/fail2ban-jail.d-metasim-production.conf
#
# Install: scripts/install-fail2ban-meta-production.sh
#
# ignoreip: append trusted IPs in /etc/mmh-virtual/fail2ban-ignoreip.conf (see example).

[DEFAULT]
# Cloud Agent egress changes; do not bake agent IPs here. Owner static IPs go in ignoreip file.
bantime  = 2h
findtime = 15m
maxretry = 8
banaction = ufw
banaction_allports = ufw
backend = systemd
usedns = no

[sshd]
enabled  = true
port     = ssh
filter   = sshd
logpath  = %(sshd_log)s
# Generous thresholds while password auth remains (Cursor Agent uses sshpass).
# Wrong Secrets retries can still trigger a ban — fix the Secret instead of lowering further.
maxretry = 12
findtime = 20m
bantime  = 1h

# nginx jails: scripts/security/fail2ban-jail.d-metasim-nginx.conf（install 時に nginx 検出で配置）