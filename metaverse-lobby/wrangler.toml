name = "metaverse-lobby"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"

[[kv_namespaces]]
binding = "LOBBY_KV"
# 初回 CI で上書き可。固定 ID: Actions variable LOBBY_KV_NAMESPACE_ID
id = "cbe06bdf1bf04ab7a6a0c647027dad48"

[[durable_objects.bindings]]
name = "LOBBY_POLLER"
class_name = "LobbyPoller"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LobbyPoller"]

[triggers]
crons = ["* * * * *"]

[vars]
LOBBY_PUBLIC_POLL_MS = "10000"