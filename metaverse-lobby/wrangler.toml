name = "metaverse-lobby"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = true
# 静的 UI は Cloudflare Pages（public/）。API のみ Worker。

[[d1_databases]]
binding = "LOBBY_DB"
database_name = "lobby-ops"
database_id = "00000000000000000000000000000001"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "LOBBY_KV"
# 初回 CI で上書き可。固定 ID: Actions variable LOBBY_KV_NAMESPACE_ID
id = "cbe06bdf1bf04ab7a6a0c647027dad48"

[[r2_buckets]]
binding = "LOBBY_ASSETS"
bucket_name = "lobby-thumbnails"

[[durable_objects.bindings]]
name = "LOBBY_POLLER"
class_name = "LobbyPoller"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LobbyPoller"]

[triggers]
crons = ["* * * * *"]

[vars]
LOBBY_PUBLIC_POLL_MS = "10000"
LOBBY_SIM_ORIGIN = "https://sim.mmh-virtual.jp"
LOBBY_PUBLIC_ORIGIN = "https://m.mmh-virtual.jp"
# Google OAuth — GHA: GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET (fallback LOBBY_GOOGLE_* / GOOGLE_OAUTH_*)
GOOGLE_CLIENT_ID = ""
GOOGLE_OAUTH_REDIRECT_URI = "https://m.mmh-virtual.jp/api/auth/google/callback"
# Optional Gemini announcement translation model (empty = gemini-3.1-flash-lite in Worker)
GEMINI_TRANSLATION_MODEL = ""
# Lobby join display-name moderation (Jev / TypeSafe — API key is Wrangler secret LOBBY_JEV_API_KEY)
LOBBY_DISPLAY_NAME_MOD_ENABLED = "1"
LOBBY_JEV_API_URL = "https://api.typesafe.ai/v1/systemone"
LOBBY_JEV_MODEL = "jev-latest"
LOBBY_JEV_REJECT_THRESHOLD = "0.7"
LOBBY_JEV_TIMEOUT_MS = "8000"