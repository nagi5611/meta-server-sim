<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>松山南高校 みんなでメタ</title>
  <link rel="icon" href="/assets/icon-192.png">
  <link rel="stylesheet" href="/colors_and_type.css">
  <link rel="stylesheet" href="/password-visibility.css">
  <link rel="stylesheet" href="/lobby.css">
  <script src="/i18n.js"></script>
</head>
<body data-i18n-document-title="lobby.title">

<header class="site-header">
  <div class="header-inner">
    <div class="site-title">
      <img src="/assets/icon-192.png" alt="" data-i18n-alt="lobby.title">
      <span data-i18n="lobby.title">みんなでメタ</span>
      <span class="sub" data-i18n="lobby.subtitle">松山南高校 ばーちゃるず</span>
    </div>

    <div class="hdr-actions" id="hdrGuest">
      <div class="locale-select" data-locale-select aria-labelledby="langLblGuest"></div>
      <span id="langLblGuest" class="sr-only" data-i18n="common.language">言語</span>
      <span class="hdr-user" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7v1H4v-1z"/></svg>
      </span>
      <button type="button" class="btn btn-text" id="openLogin" data-i18n="lobby.loginSignup">ログイン・サインアップ</button>
    </div>

    <div class="account" id="hdrUser">
      <div class="locale-select" data-locale-select aria-labelledby="langLblUser"></div>
      <span id="langLblUser" class="sr-only" data-i18n="common.language">言語</span>
      <div class="profile-menu" id="profileMenu">
        <button type="button" class="acct-profile" id="openProfile" aria-expanded="false" aria-controls="profileDrop" data-i18n-aria="profile.open">
          <span class="av" id="avInitial">N</span>
          <img class="av av-img" id="avImg" alt="" hidden decoding="async">
          <span class="who"><b id="acctName">user</b><span id="acctId">@user</span></span>
        </button>
        <div class="profile-drop" id="profileDrop" hidden>
          <p class="profile-drop__title" id="profileTitle" data-i18n="profile.title">プロフィール</p>
          <form id="profileForm" novalidate>
            <div class="profile-photo">
              <span class="profile-photo__label" data-i18n="profile.photo">プロフィール写真</span>
              <div class="profile-photo__row">
                <div class="profile-photo__preview" id="profilePhotoPreview">
                  <span class="av" id="profileAvatarPlaceholder" aria-hidden="true">?</span>
                  <img id="profileAvatarPreview" class="av av-img" alt="" hidden decoding="async">
                </div>
                <div class="profile-photo__actions">
                  <input type="file" id="profileAvatarFile" accept="image/jpeg,image/png,image/webp" hidden>
                  <button type="button" class="btn btn-text profile-photo__pick" id="profileAvatarPick" data-i18n="profile.changePhoto">写真を変更</button>
                  <p class="hint" data-i18n="profile.photoHint">正方形に切り抜き、最大128pxで保存</p>
                </div>
              </div>
            </div>
            <div class="fld">
              <label for="pName" data-i18n="auth.displayName">表示名</label>
              <div class="iwrap">
                <input id="pName" class="inp" type="text" maxlength="16" data-i18n-placeholder="lobby.displayName" autocomplete="nickname">
                <span class="cnt num" id="pCount">0/16</span>
              </div>
              <p class="hint" data-i18n="profile.hint">ワールド参加時にも使われます</p>
            </div>
            <p class="msg" id="profileErr" role="alert"></p>
            <button class="btn btn-primary btn-block" type="submit" id="profileSubmit" data-i18n="profile.save">保存する</button>
          </form>
        </div>
      </div>
      <a href="/admin/" class="hdr-admin" id="hdrAdminLink" hidden data-i18n="lobby.adminPanel">管理パネル</a>
      <button type="button" id="logoutBtn" data-i18n="lobby.logout">ログアウト</button>
    </div>
  </div>
</header>

<main class="lobby-main">
  <div class="lobby-layout">
    <section class="panel announcements" id="announcements-panel" hidden aria-labelledby="annTitle">
      <div class="panel-head">
        <h2 id="annTitle" data-i18n="lobby.announcements">お知らせ</h2>
      </div>
      <ul class="ann-list" id="announcement-list"></ul>
      <p class="ann-empty" id="announcement-empty" hidden data-i18n="lobby.announcementsEmpty">現在お知らせはありません</p>
    </section>

    <section class="panel worlds-panel" aria-labelledby="panelTitle">
      <div class="panel-head panel-head--worlds">
        <div class="panel-head-leading">
          <h2 id="panelTitle" data-i18n="lobby.worldList">メタバース一覧</h2>
          <span id="refresh-hint" class="hint num" aria-live="polite">同期中…</span>
        </div>
        <div class="panel-head-join">
          <div class="join-label">
            <b data-i18n="lobby.otherWorlds">その他のメタバース</b>
            <span data-i18n="lobby.joinByCode">参加コードで入室</span>
          </div>
          <div class="join-fields">
            <div class="iwrap">
              <input id="join-code" class="inp code-inp" type="text" maxlength="12" data-i18n-placeholder="lobby.joinCode" data-i18n-aria="lobby.joinCode" autocomplete="off" spellcheck="false">
              <span class="cnt num" id="codeCount">0/12</span>
            </div>
            <button type="button" class="btn btn-primary" id="join-code-btn" data-i18n="common.join">参加</button>
          </div>
        </div>
      </div>

      <div class="grid" id="world-grid" role="list"></div>
    </section>
  </div>
</main>

<div class="scrim" id="join-scrim" role="dialog" aria-modal="true" aria-labelledby="jName" hidden>
  <div class="dlg" id="jDlg">
    <div class="dlg-left">
      <div class="dlg-ph" id="jPh"><span data-i18n="lobby.thumbPlaceholder">サムネ画像</span></div>
      <div class="dlg-info">
        <div class="txt">
          <div class="dlg-name">
            <span id="jName"></span>
            <span class="badge" id="jStatus"><i></i><span data-i18n="status.online">稼働中</span></span>
          </div>
          <p class="dlg-players">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c0-4.1 3.4-6.4 7.5-6.4s7.5 2.3 7.5 6.4v1h-15v-1z"/></svg>
            <b class="num" id="jPlayers">0</b><span id="jPlayersSuffix" data-i18n="admin.onlineSuffix">人オンライン</span>
          </p>
        </div>
        <div class="dlg-spark">
          <svg class="spark" id="jSpark" width="104" height="34" viewBox="0 0 104 34" role="img" data-i18n-aria="lobby.spark24h"></svg>
          <span class="lbl">24h</span>
        </div>
      </div>
    </div>

    <div class="dlg-right">
      <div class="desc">
        <span class="lb" data-i18n="lobby.descLabel">説明</span>
        <p id="jDesc"></p>
      </div>

      <div class="fld" id="jField">
        <label for="display-name" data-i18n="lobby.displayName">参加時の表示名</label>
        <div class="iwrap">
          <input id="display-name" class="inp" type="text" maxlength="16" data-i18n-placeholder="lobby.displayName" autocomplete="nickname">
          <span class="cnt num" id="jCount">0/16</span>
        </div>
        <p class="msg" id="jMsg" role="alert"></p>
      </div>

      <div class="dlg-btns" id="jBtns">
        <button type="button" class="btn btn-secondary" id="join-cancel" data-i18n="common.cancel">キャンセル</button>
        <button type="button" class="btn btn-primary" id="join-go" data-i18n="common.join">参加</button>
      </div>
    </div>
  </div>
</div>

<div class="scrim" id="auth-scrim" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
  <div class="amodal">
    <div class="am-top">
      <div>
        <h2 id="modalTitle" data-i18n="auth.login">ログイン</h2>
      </div>
      <button type="button" class="am-x" id="closeModal" data-i18n-aria="common.close">×</button>
    </div>
    <form id="authForm" novalidate>
      <div class="fld" id="fldName" hidden>
        <label for="mName" data-i18n="auth.displayName">表示名</label>
        <input id="mName" type="text" placeholder="example user" autocomplete="username">
      </div>
      <div class="fld">
        <label for="mEmail" data-i18n="auth.email">メールアドレス</label>
        <input id="mEmail" type="email" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="fld">
        <label for="mPass" data-i18n="auth.password">パスワード</label>
        <div class="pwd-wrap">
          <input id="mPass" type="password" placeholder="" autocomplete="current-password" minlength="4">
        </div>
      </div>
      <p class="msg" id="authErr" role="alert"></p>
      <button class="btn btn-primary btn-block" type="submit" id="authSubmit" data-i18n="auth.submitLogin">ログイン</button>
    </form>
    <div class="am-switch">
      <span id="switchLead" data-i18n="auth.switchToSignupLead">アカウントをお持ちでない方は</span>
      <button type="button" id="switchTab" data-i18n="auth.switchToSignup">新規登録</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastTxt"></span></div>
<script src="/password-toggle.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
