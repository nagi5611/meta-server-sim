<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>松山南高校 みんなでメタ</title>
  <link rel="icon" href="/assets/icon-192.png">
  <link rel="stylesheet" href="/colors_and_type.css">
  <link rel="stylesheet" href="/lobby.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="site-title">
      <img src="/assets/icon-192.png" alt="松山南高校 自然科学部">
      みんなでメタ
      <span class="sub">松山南高校 ばーちゃるず</span>
    </div>

    <div class="hdr-actions" id="hdrGuest">
      <span class="hdr-user" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7v1H4v-1z"/></svg>
      </span>
      <button type="button" class="btn btn-text" id="openLogin">ログイン・サインアップ</button>
    </div>

    <div class="account" id="hdrUser">
      <div class="av" id="avInitial">N</div>
      <div class="who"><b id="acctName">user</b><span id="acctId">@user</span></div>
      <button type="button" id="logoutBtn">ログアウト</button>
    </div>
  </div>
</header>

<main>
  <section class="panel" aria-labelledby="panelTitle">
    <div class="panel-head">
      <h2 id="panelTitle">メタバース一覧</h2>
      <span id="refresh-hint" class="hint num" aria-live="polite">同期中…</span>
    </div>

    <div class="grid" id="world-grid" role="list"></div>

    <div class="other">
      <div class="oh">
        <b>その他のメタバース</b>
        <span>参加コードで入室</span>
      </div>
      <div class="of">
        <div class="iwrap">
          <input id="join-code" class="inp code-inp" type="text" maxlength="12" placeholder="参加コード" autocomplete="off" spellcheck="false" aria-label="参加コード">
          <span class="cnt num" id="codeCount">0/12</span>
        </div>
        <button type="button" class="btn btn-primary" id="join-code-btn">参加</button>
      </div>
    </div>
  </section>
</main>

<div class="scrim" id="join-scrim" role="dialog" aria-modal="true" aria-labelledby="jName" hidden>
  <div class="dlg" id="jDlg">
    <div class="dlg-left">
      <div class="dlg-ph" id="jPh"><span>サムネ画像</span></div>
      <div class="dlg-info">
        <div class="txt">
          <div class="dlg-name">
            <span id="jName"></span>
            <span class="badge" id="jStatus"><i></i>稼働中</span>
          </div>
          <p class="dlg-players">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c0-4.1 3.4-6.4 7.5-6.4s7.5 2.3 7.5 6.4v1h-15v-1z"/></svg>
            <b class="num" id="jPlayers">0</b>人オンライン
          </p>
        </div>
        <div class="dlg-spark">
          <svg class="spark" id="jSpark" width="104" height="34" viewBox="0 0 104 34" role="img" aria-label="過去24時間のアクセス推移"></svg>
          <span class="lbl">24h</span>
        </div>
      </div>
    </div>

    <div class="dlg-right">
      <div class="desc">
        <span class="lb">説明</span>
        <p id="jDesc"></p>
      </div>

      <div class="fld" id="jField">
        <label for="display-name">参加時の表示名</label>
        <div class="iwrap">
          <input id="display-name" class="inp" type="text" maxlength="16" placeholder="参加時の表示名" autocomplete="nickname">
          <span class="cnt num" id="jCount">0/16</span>
        </div>
        <p class="msg" id="jMsg" role="alert"></p>
      </div>

      <div class="dlg-btns" id="jBtns">
        <button type="button" class="btn btn-secondary" id="join-cancel">キャンセル</button>
        <button type="button" class="btn btn-primary" id="join-go">参加</button>
      </div>
    </div>
  </div>
</div>

<div class="scrim" id="auth-scrim" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
  <div class="amodal">
    <div class="am-top">
      <div>
        <h2 id="modalTitle">ログイン</h2>
      </div>
      <button type="button" class="am-x" id="closeModal" aria-label="閉じる">×</button>
    </div>
    <form id="authForm" novalidate>
      <div class="fld" id="fldName" hidden>
        <label for="mName">ユーザー名</label>
        <input id="mName" type="text" placeholder="example user" autocomplete="username">
      </div>
      <div class="fld">
        <label for="mEmail">メールアドレス</label>
        <input id="mEmail" type="email" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="fld">
        <label for="mPass">パスワード</label>
        <input id="mPass" type="password" placeholder="" autocomplete="current-password" minlength="4">
      </div>
      <p class="msg" id="authErr" role="alert"></p>
      <button class="btn btn-primary btn-block" type="submit" id="authSubmit">ログイン</button>
    </form>
    <div class="am-switch">
      <span id="switchLead">アカウントをお持ちでない方は</span>
      <button type="button" id="switchTab">新規登録</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastTxt"></span></div>
<script type="module" src="/app.js"></script>
</body>
</html>
