<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>パスワード再設定｜みんなでメタ</title>
<link rel="icon" href="/assets/icon-192.png">
<link rel="stylesheet" href="/colors_and_type.css">
<style>
body { font-family: var(--font-sans, system-ui, sans-serif); margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--color-bg, #f4f5f7); }
.box { width: min(400px, 92vw); background: #fff; border-radius: 12px; padding: 28px 24px; box-shadow: 0 8px 32px rgba(0,0,0,.08); }
h1 { font-size: 1.15rem; margin: 0 0 8px; }
.lead { color: var(--color-muted, #5c6370); font-size: .9rem; margin: 0 0 20px; }
label { display: block; font-size: .85rem; margin-bottom: 6px; }
input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #c9ced6; border-radius: 8px; margin-bottom: 14px; }
button { width: 100%; padding: 12px; border: 0; border-radius: 8px; background: var(--color-primary, #2563eb); color: #fff; font-weight: 600; cursor: pointer; }
button:disabled { opacity: .6; cursor: wait; }
.err { color: #c0392b; font-size: .85rem; min-height: 1.2em; }
.ok { color: #1a7f4e; font-size: .9rem; }
a { color: var(--color-primary-dark, #1d4ed8); }
</style>
</head>
<body>
<div class="box">
  <h1>新しいパスワード</h1>
  <p class="lead">メールのリンクから開いたページです。</p>
  <form id="form">
    <label for="pass">新しいパスワード</label>
    <input id="pass" type="password" autocomplete="new-password" minlength="8" required>
    <label for="pass2">確認</label>
    <input id="pass2" type="password" autocomplete="new-password" minlength="8" required>
    <p class="err" id="err"></p>
    <button type="submit" id="btn">変更する</button>
  </form>
  <p class="ok" id="ok" hidden>変更しました。<a href="/">ロビーへ</a></p>
</div>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const token = params.get('token') || '';
  const form = document.getElementById('form');
  const err = document.getElementById('err');
  const ok = document.getElementById('ok');
  const btn = document.getElementById('btn');
  if (!token) {
    err.textContent = 'リンクが無効です。もう一度再設定メールを依頼してください。';
    form.hidden = true;
    return;
  }
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.textContent = '';
    const p1 = document.getElementById('pass').value;
    const p2 = document.getElementById('pass2').value;
    if (p1 !== p2) { err.textContent = '確認用パスワードが一致しません'; return; }
    if (p1.length < 8) { err.textContent = '8文字以上で入力してください'; return; }
    btn.disabled = true;
    try {
      const res = await fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ token, password: p1 }),
      });
      const data = await res.json();
      if (!res.ok) {
        err.textContent =
          data.error === 'TOKEN_EXPIRED' ? 'リンクの有効期限が切れました' :
          data.error === 'INVALID_TOKEN' ? 'リンクが無効です' :
          '変更に失敗しました';
        btn.disabled = false;
        return;
      }
      form.hidden = true;
      ok.hidden = false;
    } catch {
      err.textContent = '通信に失敗しました';
      btn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
