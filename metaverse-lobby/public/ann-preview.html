<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="lobby.css" />
  <title>Announcements preview</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f4f5f7; }
    .wrap { max-width: var(--container, 960px); margin: 40px auto; padding: 0 24px; }
    .main-ph {
      min-height: 120px; border: 1px dashed #ccc; border-radius: 12px;
      display: grid; place-items: center; color: #888; font-size: 14px;
      background: #fff;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="lobby-layout">
      <div class="lobby-top-row">
        <section class="panel announcements" id="announcements-panel" aria-labelledby="annTitle">
          <div class="panel-head">
            <h2 id="annTitle">お知らせ</h2>
          </div>
          <ul class="ann-list" id="announcement-list"></ul>
        </section>
        <section class="panel join-code-panel" aria-labelledby="joinCodeTitle">
          <div class="panel-head">
            <h2 id="joinCodeTitle">メタバース参加コード</h2>
          </div>
          <div class="join-panel-body">
            <p class="join-panel-hint">参加コードで入室</p>
            <div class="join-fields">
              <div class="iwrap">
                <input class="inp code-inp" type="text" maxlength="12" placeholder="参加コード" value="ABC123">
                <span class="cnt num">6/12</span>
              </div>
              <button type="button" class="btn btn-primary">参加</button>
            </div>
          </div>
        </section>
      </div>
      <div class="main-ph">メタバース一覧（下のパネル）</div>
    </div>
  </div>
  <script type="module">
    const items = [
      { id: '1', title: '短い告知', createdAt: '2026-11-20T09:00:00.000Z' },
      { id: '2', title: 'とても長いタイトルのお知らせで省略記号が出るかどうかの確認用サンプル', createdAt: '2026-11-19T08:00:00.000Z' },
    ];
    const list = document.getElementById('announcement-list');
    for (const a of items) {
      const li = document.createElement('li');
      li.className = 'ann-item';
      const head = document.createElement('div');
      head.className = 'ann-head';
      const title = document.createElement('h3');
      title.className = 'ann-title';
      title.textContent = a.title;
      const timeEl = document.createElement('time');
      timeEl.className = 'ann-date';
      timeEl.textContent = '2026/11/20';
      head.appendChild(timeEl);
      head.appendChild(title);
      li.appendChild(head);
      list.appendChild(li);
    }
  </script>
</body>
</html>
