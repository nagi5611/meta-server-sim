<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理｜みんなでメタ</title>
<link rel="icon" href="/assets/icon-192.png">
<link rel="stylesheet" href="/colors_and_type.css">
<link rel="stylesheet" href="/password-visibility.css">
<link rel="stylesheet" href="/lobby.css">
<link rel="stylesheet" href="/admin/admin.css">
<script src="/i18n.js"></script>
</head>
<body data-i18n-document-title="admin.documentTitle">

<section class="gate" id="gate" data-screen-label="Basic認証">
  <form class="gate-box" id="gateForm" novalidate autocomplete="off">
    <div class="gate-mark"><img src="/assets/icon-192.png" alt=""><span data-i18n="lobby.title">みんなでメタ</span></div>
    <h1 data-i18n="admin.gateTitle">管理画面にログイン</h1>
    <div class="locale-select locale-select--block" data-locale-select aria-labelledby="langLblGate"></div>
    <span id="langLblGate" class="sr-only" data-i18n="common.language">言語</span>
    <div class="field">
      <label for="gUser" data-i18n="admin.gateUser">ユーザー名 / メール</label>
      <input class="inp" id="gUser" type="text" autocomplete="username" spellcheck="false">
    </div>
    <div class="field">
      <label for="gPass" data-i18n="auth.password">パスワード</label>
      <div class="pwd-wrap">
        <input class="inp" id="gPass" type="password" autocomplete="current-password">
      </div>
    </div>
    <div class="field" id="gateOtpField" hidden>
      <label for="gOtp" data-i18n="admin.gateOtpLabel">確認コード（SMS）</label>
      <input class="inp" id="gOtp" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" spellcheck="false">
      <p class="meta-line" id="gateOtpHint" style="margin-top:8px"></p>
    </div>
    <p class="gate-audit" id="gateAudit" hidden></p>
    <p class="gate-err" id="gateErr" role="alert"></p>
    <button class="btn btn-primary btn-block" type="submit" id="gateBtn" style="height:40px" data-i18n="admin.gateLogin">ログイン</button>
  </form>
</section>

<div class="shell" id="app" hidden>
  <aside class="side">
    <a class="side-mark" href="#" data-nav="worlds">
      <img src="/assets/icon-192.png" alt="">
      <span><span data-i18n="lobby.title">みんなでメタ</span><small data-i18n="admin.brandSmall">管理</small></span>
    </a>

    <nav class="side-nav" id="nav">
      <a href="#" class="snav" data-nav="worlds"><span data-i18n="admin.navWorlds">メタバース</span><b class="num" id="cw">0</b></a>
      <a href="#" class="snav" data-nav="users"><span data-i18n="admin.navUsers">ユーザー</span><b class="num" id="cu">0</b></a>
      <a href="#" class="snav" data-nav="announcements"><span data-i18n="admin.navAnnouncements">お知らせ</span><b class="num" id="ca">0</b></a>
      <a href="#" class="snav" data-nav="logs"><span data-i18n="admin.navLogs">参加履歴</span></a>
      <a href="#" class="snav" data-nav="settings"><span data-i18n="admin.navSettings">設定</span></a>
    </nav>

    <div class="side-foot">
      <div class="locale-select locale-select--block" data-locale-select aria-labelledby="langLblSide"></div>
      <span id="langLblSide" class="sr-only" data-i18n="common.language">言語</span>
      <a class="side-link" href="/" target="_blank" rel="noopener" data-i18n="admin.openPublic">公開ページを開く ↗</a>
      <p class="side-audit" id="superLoginAudit" hidden></p>
      <div class="side-user">
        <span class="av">A</span>
        <span class="who"><b id="whoUser">admin</b><span data-i18n="admin.roleAdmin">管理者</span></span>
        <button type="button" class="txt-btn" id="logoutBtn" data-i18n="lobby.logout">ログアウト</button>
      </div>
    </div>
  </aside>

  <main class="page" id="main"></main>
</div>

<div class="scrim" id="scrim"></div>
<div class="toast" id="toast"></div>

<script src="/password-toggle.js"></script>
<script type="module">
  import * as LobbyTime from '/lobby-time.js';
  window.LobbyTime = LobbyTime;
  import '/admin-thumbnail.js';
  import { isLobbyEntryUrlAllowed, lobbyEntryUrlPolicyHintJa } from '/lobby-entry-url-policy.js';
  window.LobbyEntryUrlPolicy = { isLobbyEntryUrlAllowed, lobbyEntryUrlPolicyHintJa };
</script>
<script src="/admin/api.js"></script>
<script src="/admin/store.js"></script>
<script src="/admin/ui.js"></script>
<script src="/admin/panel.js"></script>
</body>
</html>
