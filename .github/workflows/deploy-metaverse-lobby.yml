name: Deploy metaverse-lobby (Worker + Pages)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'metaverse-lobby/**'
      - 'scripts/lobby-provision-cloudflare.sh'
      - '.github/workflows/deploy-metaverse-lobby.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: metaverse-lobby/package-lock.json
      - name: Wrangler dry-run
        working-directory: metaverse-lobby
        run: |
          npm ci
          npx wrangler deploy --dry-run
      - name: Check Pages static paths
        working-directory: metaverse-lobby
        run: test -f functions/api/'[[path]]'.js && test -f public/index.html

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: metaverse-lobby/package-lock.json
      - name: Deploy lobby Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LOBBY_KV_NAMESPACE_ID: ${{ vars.LOBBY_KV_NAMESPACE_ID }}
          LOBBY_WORKERS_DEV_SUBDOMAIN: ${{ secrets.LOBBY_WORKERS_DEV_SUBDOMAIN }}
          LOBBY_PRESENCE_SECRET: ${{ secrets.LOBBY_PRESENCE_SECRET }}
          LOBBY_WORKER_SYNC_SECRET: ${{ secrets.LOBBY_WORKER_SYNC_SECRET }}
          LOBBY_CUSTOM_HOSTNAME: ${{ vars.LOBBY_CUSTOM_HOSTNAME || 'm.mmh-virtual.jp' }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set in repository secrets; skipping deploy."
            exit 0
          fi
          if [ -z "${LOBBY_PRESENCE_SECRET:-}" ] || [ -z "${LOBBY_WORKER_SYNC_SECRET:-}" ]; then
            echo "::error::Repository secrets LOBBY_PRESENCE_SECRET and LOBBY_WORKER_SYNC_SECRET are required (same values as sim .env). Add them under Settings → Secrets and variables → Actions, then re-run this workflow."
            exit 1
          fi
          chmod +x scripts/lobby-provision-cloudflare.sh
          bash scripts/lobby-provision-cloudflare.sh
      - name: Upload lobby-secrets.env
        if: success() && hashFiles('lobby-secrets.env') != ''
        uses: actions/upload-artifact@v4
        with:
          name: lobby-secrets
          path: lobby-secrets.env
          retention-days: 3
          if-no-files-found: ignore
      - name: Upload deploy log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lobby-deploy-log
          path: /tmp/lobby-wrangler-deploy.log
          if-no-files-found: ignore