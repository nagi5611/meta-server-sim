# Issue #46: keep npm dependencies scanned and updatable via Dependabot PRs.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
  - package-ecosystem: npm
    directory: /metaverse-lobby
    schedule:
      interval: weekly
    open-pull-requests-limit: 5